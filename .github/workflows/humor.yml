name: Humor Bot

on:
  schedule:
    # 15분마다 깨어나서, 마지막 실행 이후 흐른 시간만큼 (시간당 2~3편) 올린다. 실행이 밀려도 따라잡는다.
    # 정각/30분은 GitHub 가 가장 붐벼 예약 실행이 몇 시간씩 밀리므로 일부러 어긋난 분(11, 26, 41, 56)을 쓴다.
    # 이미 실행 중이면 concurrency 때문에 한 개만 대기하므로 겹쳐 돌지 않는다.
    - cron: "11,26,41,56 * * * *"
  # run_request.txt 를 올리면 그 안의 숫자만큼 스케줄과 상관없이 바로 올린다 (푸시로 실행을 시작하는 용도).
  push:
    paths:
      - "run_request.txt"
  workflow_dispatch:
    inputs:
      count:
        description: "스케줄 무시하고 지금 처리할 편수 (0 이면 스케줄대로)"
        default: "0"
      dry_run:
        description: "true 면 읽기/재작성만 하고 등록하지 않는다 (시험용)"
        type: boolean
        default: false

permissions:
  contents: write

# 같은 시각에 두 번 돌면 중복 글이 올라가므로 한 번에 하나만 돌린다.
concurrency:
  group: humor-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # 설정/상태는 비공개 저장소에 둔다. 저장소 이름과 토큰은 Secrets 에서만 읽는다.
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          # 재작성은 Gemini 무료 API 로만 한다. Claude 는 쓰지 않으므로 Claude 사용량이 차감되지 않는다.
          REWRITE_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_LOGIN_ID: ${{ secrets.SITE_LOGIN_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          STATE_DIR: ${{ github.workspace }}/private
        run: |
          COUNT="${{ github.event.inputs.count }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            if head -1 run_request.txt | grep -q '^audit'; then
              python -m bot.run --audit "$(head -1 run_request.txt | tr -dc '0-9')"
              exit 0
            fi
            if head -1 run_request.txt | grep -q '^preview'; then
              python -m bot.run --preview "$(head -1 run_request.txt | tr -dc '0-9')"
              exit 0
            fi
            if head -1 run_request.txt | grep -q '^calibrate'; then
              python -m bot.run --calibrate "$(head -1 run_request.txt | tr -dc '0-9')"
              exit 0
            fi
            COUNT="$(tr -dc '0-9' < run_request.txt | head -c 1)"
          fi
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          if [ -n "$COUNT" ] && [ "$COUNT" != "0" ]; then
            python -m bot.run $DRY --count "$COUNT"
          elif [ -n "$DRY" ]; then
            python -m bot.run --dry-run
          else
            python -m bot.run
          fi

      - name: Save state (private repo)
        if: always()
        working-directory: private
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json calibration.json preview.json audit.json 2>/dev/null || git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "state $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase || true
          git push
