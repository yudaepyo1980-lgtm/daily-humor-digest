name: Keepalive

# 공개 저장소는 60일 동안 활동이 없으면 예약 실행이 자동으로 꺼진다.
# 한 달에 한 번 빈 커밋을 남겨서 막는다.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git commit --allow-empty -m "keepalive $(date -u +'%Y-%m-%d')"
          git push
